schema_version: 1
kind: pinned_contract_manifest

# ===========================================================================
# neutral-product-pin.yaml — THE TEMPLATE for a pin on a neutral product.
#
# This file is not copied into a project under this name. It is RENDERED once
# per declared pin as `contracts/<product lowercased>-pin.yaml` — so a project
# declaring `openGlass` carries `contracts/openglass-pin.yaml` — by
# `scaffold-project.py --pin <openProduct>@<commit>`.
#
# WHAT IT IS FOR. `<Domainx><Product>` is a CLAIM of descent and a claim needs
# a REFERENT (Brett Heap, 2026-09-02). The referent is a pin the project
# DECLARES: `neutral_product_pins:` in `project.yaml` names the product and
# this file carries the commit and digest that make the declaration a fact in
# the project's own tree. That is what keeps the check OFFLINE — classifying
# `MedxGlass` never asks GitHub whether `openGlass` exists.
#
# IT CONFERS NOTHING, like every other file here. Declaring descent grants no
# review authority over the product, no clearance, and no gate standing; it
# records which neutral product this project's name descends from and at which
# commit that reading was taken.
#
# A COMMIT, NEVER A TAG. A tag can be moved and a commit cannot; a pin never
# expresses a range. The digest is `sorted-ls-tree-r-v1`, the same definition
# every other pin here uses, computed over the product's tree at that commit.
# ===========================================================================

pin_role: neutral-product
product: openDox
source_repository: opensoft/openDox
materialization: referenced

commit: "8ec3036ce496a90a3c92a89c4907e57941901b51"
revision_kind: commit

digest_algorithm: sha256
digest_definition: sorted-ls-tree-r-v1
digests:
  tree_sha256: "71b97c8bec10f1e85f6d56be52b7a83966232d7591952ad5e0af7db68192b392"

# How the digest above was read, so a later reader knows whether it came from
# a clone on this machine or from the forge's own tree listing.
digest_source: gh-api-tree-recursive

# PER-FILE `sha256:` / `pinned_by_commit_only:` — the MODIFIED
# `neutral-product-pin` requirement's "The product digests only part of its
# release surface" scenario asks for a per-file `sha256` for every artifact
# openDox's OWN manifest digests per file, and `pinned_by_commit_only:` for
# the rest. Checked directly at this commit: `opensoft/openDox`
# `contracts/manifest.yaml` carries `contract_bundle_version: none` and
# `entries: []` — openDox has published no contract bundle, so that set is
# EMPTY. This is the identical fact `scripts/verify-openxdox-pin.py`
# (openxFactory's own pin of openXdox, one link up this same chain) found for
# ITS upstream and resolved the same way: "the whole-tree digest... discharges
# the completeness obligation those two lists exist to serve, and discharges
# it more strongly... ONE digest addresses EVERY byte inside it, so no member
# can be undeclared and none can be added or altered without changing the
# referent." Neither list is added here for that reason — a HAND ACT judgment
# recorded for review, not a silent omission. Revisit at the first commit
# where openDox's own `contracts/manifest.yaml` carries a non-empty `entries:`
# row: that artifact then moves into a `files:` list here.

# MIGRATION DECLARATION — MODIFIED `neutral-product-pin` requirement, "A pin
# bump crosses a migration" scenario (`split-opendox-two-layer-product`
# design.md § D4 / task 4.2). RULED ASK-1 (Brett Heap,
# `opensoft/openxFactory#656` comment 5628886636, 2026-09-11): the three
# fields below are added NOW with an explicit `not_yet_deployed` sentinel,
# proving the schema shape before a real migration exists to fill it —
# RULING Q2's FastAPI+Postgres runtime is itself unbuilt and
# `opensoft/openDox-code` carries no migrations directory yet (checked at
# `da8aae96`, the commit this root's own `code` pin currently names). Update
# these at the FIRST real migration a bump of this pin crosses, not before.
migration:
  range: not_yet_deployed
  reversible: not_yet_deployed
  runbook: not_yet_deployed

# RECORD 2 OF THREE for the openDox carve (RULED OQ-I, Brett Heap,
# `opensoft/openxFactory#656`, 2026-09-09), written when this pin was bumped
# onto the carved root at runbook § 6 / `split-opendox-two-layer-product`
# task 4.2. It is the openxFactory commit the carve was TAKEN FROM — the
# byte-identity referent that survives into the tree the gate reads, because
# "HEAD" is no referent across a multi-pull-request wave. Precedent:
# `opensoft/openxFactory`'s own `contracts/openxwallet-pin.yaml`, which
# carries this key in this position, directly after `digest_source:`.
#
# IT BELONGS HERE AND NOT IN THE LEG PINS. `carve_commit:` is reserved for a
# pin on a WHOLE carved assembly root — this file and openxFactory's future
# `contracts/openxdox-pin.yaml` — never for `contracts/code-pin.yaml` or
# `contracts/spec-pin.yaml`, which are ordinary submodule pins on this
# project's own legs and exist independent of any carve. Record 1 is
# `carved_from:` in `contracts/manifest.yaml` beside this file; record 3 is
# openxFactory's `docs/opendox-cutover-runbook.md`, the procedure.
carve_commit: "b075fd91dc8fced8e1373825ba80220c33536bae"

declared_in: project.yaml
verify_pin: scripts/validate-manifest.py
