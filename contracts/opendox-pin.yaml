kind: pinned_contract_manifest

# ===========================================================================
# neutral-product-pin.yaml — THE TEMPLATE for a pin on a neutral product.
#
# This file is not copied into a project under this name. It is RENDERED once
# per declared pin as `contracts/<product lowercased>-pin.yaml` — so a project
# declaring `openGlass` carries `contracts/openglass-pin.yaml` — by
# `scaffold-project.py --pin <openProduct>@<commit>`.
#
# WHAT IT IS FOR. `<Domainx><Product>` is a CLAIM of descent and a claim needs
# a REFERENT (Brett Heap, 2026-09-02). The referent is a pin the project
# DECLARES: `neutral_product_pins:` in `project.yaml` names the product and
# this file carries the commit and digest that make the declaration a fact in
# the project's own tree. That is what keeps the check OFFLINE — classifying
# `MedxGlass` never asks GitHub whether `openGlass` exists.
#
# IT CONFERS NOTHING, like every other file here. Declaring descent grants no
# review authority over the product, no clearance, and no gate standing; it
# records which neutral product this project's name descends from and at which
# commit that reading was taken.
#
# A COMMIT, NEVER A TAG. A tag can be moved and a commit cannot; a pin never
# expresses a range. The digest is `sorted-ls-tree-r-v1`, the same definition
# every other pin here uses, computed over the product's tree at that commit.
# ===========================================================================

pin_role: neutral-product
product: openDox
source_repository: opensoft/openDox
materialization: referenced

commit: "dc7aa08fe48c8d17b596b0daa1ce87cdc0472aca"
revision_kind: commit

digest_algorithm: sha256
digest_definition: sorted-ls-tree-r-v1
digests:
  tree_sha256: "adc049c973298e44064187aa91cd5c987aec1b911ebb8dea607648c9ae7f7cee"

# How the digest above was read, so a later reader knows whether it came from
# a clone on this machine or from the forge's own tree listing.
digest_source: local-checkout

# PER-FILE `sha256:` / `pinned_by_commit_only:` — the MODIFIED
# `neutral-product-pin` requirement's "The product digests only part of its
# release surface" scenario asks for a per-file `sha256` for every artifact
# openDox's OWN manifest digests per file, and `pinned_by_commit_only:` for
# the rest.
#
# AMENDED 2026-09-21 — RULED by Brett Heap at `opensoft/openxFactory#656`
# comment 5768144952, verbatim "(b) for the pin shape, keep going". THE
# REVISIT THIS PARAGRAPH NAMED IS DUE, AND ITS ANSWER IS THAT THE LISTS ARE
# STILL NOT OWED. Checked at THIS pin's own commit, `dc7aa08f`:
# `opensoft/openDox` `contracts/manifest.yaml` no longer reads
# `contract_bundle_version: none` / `entries: []` — it carries
# `contract_bundle_version: dox-v1.0` and THREE `entries:`, every one
# digested per file — `xfactory-workbench-chat-turn`,
# `xfactory-workbench-model-catalog` and `ideation-workbench`, all at
# `path: contracts/schemas/...` in `opensoft/openDox-spec` at `8fe8c4c7`.
# So the revisit this paragraph's own closing sentence named — "the first
# commit where openDox's own `contracts/manifest.yaml` carries a non-empty
# `entries:` row" — was already DUE the moment this pin advanced to
# `dc7aa08f` at `openXdox#15`, and stayed unnoticed until this amendment: a
# gap in the record, closed here rather than quietly.
#
# THE CONCLUSION DOES NOT CHANGE, because the paragraph below already gave
# the STRONGER, independent reason. This is the identical fact
# `scripts/verify-openxdox-pin.py` (openxFactory's own pin of openXdox, one
# link up this same chain) found for ITS upstream and resolved the same
# way: the whole-tree `sorted-ls-tree-r-v1` digest above covers EVERY byte
# of the pinned root tree, so no member can be undeclared and none can be
# added or altered without changing the referent — it discharges the
# completeness obligation those two lists exist to serve, and discharges it
# MORE STRONGLY than an enumeration would. The three artifacts above sit in
# openDox's SPEC leg, itself pinned by commit AND digest in openDox's own
# `contracts/spec-pin.yaml`, so they are covered by a digest chain end to
# end and an enumeration here would add a second, weaker statement of the
# same fact — one that could drift. Neither list is added here for that
# reason — a HAND ACT judgment recorded for review, not a silent omission,
# now RESOLVED rather than merely held pending a revisit that has already
# passed.
#
# openxFactory's own direct `contracts/opendox-pin.yaml` makes the
# IDENTICAL amendment at `opensoft/openxFactory#1134` (same ruling, same
# comment `5768144952`): both pins name openDox at the same
# trigger-crossing commit, so both reach the same resolution. It did not
# come with `openXdox#15` because the claim posted as `5767868394` was an
# earlier draft that lacked this finding — a gap in the record, stated
# rather than quietly closed.

# MIGRATION DECLARATION — MODIFIED `neutral-product-pin` requirement, "A pin
# bump crosses a migration" scenario (`split-opendox-two-layer-product`
# design.md § D4 / task 4.2). RULED ASK-1 (Brett Heap,
# `opensoft/openxFactory#656` comment 5628886636, 2026-09-11): the three
# fields below are added NOW with an explicit `not_yet_deployed` sentinel,
# proving the schema shape before a real migration exists to fill it —
# RULING Q2's FastAPI+Postgres runtime is itself unbuilt and
# `opensoft/openDox-code` carries no migrations directory yet (checked at
# `da8aae96`, the commit this root's own `code` pin currently names). Update
# these at the FIRST real migration a bump of this pin crosses, not before.
#
# FILLED AT THIS BUMP (2026-09-21) — that test is now MET, and the sentinel
# above is kept as the history of why it stood. This pin advanced `c4c5014d`
# -> `dc7aa08f` (the commit `dox-v1.0` tags), carrying openDox's `code` leg
# `0b4e8bbf` -> `d816cf06`, across which paths matching `migration` go from
# ZERO to SIX -- among them `migrations/0001_identity_and_coordination.sql`
# and `migrations/0002_migration_state.sql`. So this bump IS the first real
# migration this pin crosses, and the three fields are filled by measurement
# rather than left asserting something the same commit falsifies.
# `range` follows the ledger's own `<version>_<name>`; the SPELLING
# `0001..0002` was chosen by the holder, none being specified anywhere.
# `reversible: false` is openDox's own statement, not an inference --
# `0002_migration_state.sql` reads "openDox ships no down migration today",
# its ledger column is `reversible boolean not null default false`, and
# neither migration carries a down or rollback statement. `runbook` names
# openDox's OWN: `docs/runtime.md` in `opensoft/openDox-code` at the pinned
# code leg `d816cf06`, titled "The openDox runtime -- a runbook", whose
# section 5 "Migrations" states the canonical-digest and ledger rules and whose
# section 6 "Running it" states the execution and the re-run --
# `deploy/kubernetes/base/migration-job.yaml` points at it by name ("runbook
# (`docs/runtime.md` section 6) states the re-run").
#
# CORRECTION, RECORDED RATHER THAN QUIETLY FIXED: this field first read "none
# exists as of 2026-09-21", and that was FALSE. The search behind it matched
# FILE NAMES only -- `docs/profile-registration-runbook.md` was the sole hit --
# and never opened `docs/runtime.md`, whose name does not carry the word
# "runbook" or "migration". Copilot's review of openXdox#15 caught the false
# absence at the exact head and it was corrected in that round. The
# openxFactory#656 answer 5767868616 that ratified the absence was given on
# that same bad measurement; the correction is reported back to it.
# NOTHING READS THESE THREE FIELDS -- `migration`
# occurs 0 times in this repository's `scripts/validate-pins.py` and 0 times in
# openxFactory's `scripts/verify-opendox-pin.py` -- so any value passes green,
# which is exactly why it must be the honest one. Claimed at
# `opensoft/openxFactory#656` comment 5767868394 and decided at 5767868616;
# openxFactory's own direct `contracts/opendox-pin.yaml` carries the identical
# triple and takes these IDENTICAL values when its nested legs advance.
migration:
  range: "0001..0002"
  reversible: false
  runbook: "opensoft/openDox-code docs/runtime.md sections 5-6, at the pinned code leg d816cf06 - the Kubernetes migration Job names it for the re-run; corrected from a false absence at Copilot review of openXdox#15, reported back to openxFactory#656 5767868616"

