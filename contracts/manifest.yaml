# both, cut the tags when the drafts are green." The annotated tag over the
# commit that names both legs plus these entries is the operator's act (runbook
# § 9 Phase 6, "BRETT'S ACT, ALWAYS"); this file is the entry beside it and makes
# no tag.
contract_bundle_version: xdox-v1.0

# ===========================================================================
# WHAT AN ENTRY IS, AND WHERE EVERY FIELD CAME FROM.
#
# NOTHING IN THIS TREE VALIDATES THIS FILE — see the carve-provenance note
# below, which predates this bundle and is still true:
# `scripts/validate-manifest.py` reads `project.yaml`
# (`kind: project-manifest`), NOT this file. So the shape below is not read off
# a schema, because there is none; every field is lifted from a family artifact
# that already answers the same question:
#
#   `id`, `path`, the leg `repository`, the leg `commit`, `sha256`
#       the five columns of openxFactory's OWN contract-v4.0 relocation table
#       ("manifest `id` | path it held | canonical home | leg commit | `sha256`,
#       unchanged") — the table that shed three of the rows below INTO this
#       project.
#   `type`, `contract_schema_version`, `release_member`
#       openxFactory's `contracts/hermes-runtime/contract-index.yaml` row
#       fields, unchanged in spelling.
#
# THE ONE NEW THING is that a row addresses a file in a PINNED SUBMODULE rather
# than in this tree. That is what a three-repository project's bundle IS: the
# root holds no contract bytes of its own and a consumer's pin points here, so
# the bundle can only be the legs at the commits `contracts/spec-pin.yaml` and
# `contracts/code-pin.yaml` name. Each `commit:` below is EXACTLY the value in
# those pin files — if they disagree, the pin files are right and this is stale.
#
# THE KEY IS `entries:` AND IS NOT BEING RENAMED. `opensoft/openXwallet` uses
# `contracts:` and `kind: contract_manifest`; openxFactory uses `contracts:` and
# no `kind:` at all; this project declared `entries:` and
# `kind: contract-manifest` at bootstrap. openXwallet's own manifest states the
# rule that settles it — "Machine keys do NOT move in v1 (R2, LOCKED) … a
# rename inside the move is unbisectable" — and a first release is the worst
# moment to rename the key a consumer would pin. The three-way divergence is
# registered on `#656` (comment 5767092136) for a later ruling, not decided here.
#
# RELEASE-SURFACE SELECTION RULE, declared rather than inferred, on
# openXwallet's precedent ("wallet-vN.M.digests.yaml selects { row |
# row.member_class == "owned" }"):
#
#     xdox-vN.M  selects  { entry | entry.release_member == true }
#
# Selection is by DECLARED FIELD, never by a `contracts/schemas/` path
# heuristic — which would break on the very list below, where one member and
# four non-members share that directory. AND MEMBERSHIP IS NOT THIS PROJECT'S TO
# ASSERT: openxFactory's contract-v4.0 entry rules that "inventory membership is
# catalog-driven from `contracts/hermes-runtime/contract-index.yaml`, not from
# `manifest.yaml`", naming `gate-action-record` as a member that STAYS a member
# and saying of the other two shed here that "`ideation-dashboard-snapshot` and
# `ideation-dashboard-snapshot-index` were never catalog members and are in no
# inventory". `domain-profile` is likewise absent from that catalog's 51 rows.
# Every `release_member:` below is therefore a measurement, not a judgement.
#
# `adapter_owner:` and `intended_consumers:` are deliberately ABSENT. Nothing in
# this tree reads them and a first bundle carrying fields no reader consumes is
# decoration; either is one additive line the day a consumer needs it.
#
# THE CODE LEG CONTRIBUTES NO ENTRY. `opensoft/openXdox-code` at
# ab04453de25b5c93479a5a6ff3700aec02f6e2b3 carries no `contracts/` path at all
# (measured with `git ls-tree -r`), so its absence from the list is a fact about
# that leg and not an omission. RE-MEASURED the same way at each code leg this
# root has pinned since: 195276b75358d2f4d1f0b3eb17b8b62a3c01c409
# (`opensoft/openXdox-code` #26, the `DISPLAY` facet),
# 626f2c8d55a8a32111863e55c82599c5c1a88e69 (#27, that facet's item nouns),
# e28930bf052febff0c7bdd0463a72ce3c4f5e8fe (#28, the snapshot validator's
# `split-opendox-two-layer-product` § 8.9 residue),
# 6158151e7f5202e1894f13365702daedca88cc26 (#29-#33, plan 034 T040-T044: the
# carve residue, the declared exclusion, `tests/integration/`, the whole suite
# in the required check, and the six `doc_health` skips asserting for real),
# 6a3b93b93cd647ea0c62aa7bb5cdff529a2c35e8 (#34-#36, plan 034 T060, T059 and
# T061: the facet's governed `values`, the governed generator, registry and
# source through openDox's seams, and the consumer's validator located through
# the installed distribution) and 56e1c238681a7693a4d8d42a62c1523cf4d4ab91
# (#37, plan 034 T086: openXdox's gate, scope, kickoff and register contributed
# at openDox's column seams, and its gate and projection columns through
# openDox's handler-contribution facet), the leg this root pins from this
# commit forward. Through `6158151e` none carries a `contracts/` path. From
# `6a3b93b9` the leg packages COPIES of three of the spec leg's schemas under
# `src/openxdox/contracts/schemas/` (`gate-action-record`,
# `ideation-dashboard-snapshot`, `ideation-dashboard-snapshot-index`), each
# byte-identical (sha256) to its row below and recorded by
# `src/openxdox/contracts/copies.yaml` against spec `f088b097`, unchanged
# through `56e1c238`. They are the spec leg's bytes, not a contract of the code
# leg's own, so the code leg still contributes no entry and none of the five
# rows below moves. `xdox-v1.0` keeps `ab04453d`, the leg it was cut over; no
# advance cuts a bundle.
#
# WHAT THIS BUNDLE DEPENDS ON, STATED BECAUSE IT IS NOT OBVIOUS. openXdox is a
# domain descendant of openDox and pins it at `contracts/opendox-pin.yaml`,
# commit e1e3a3c3f8dd38214510412b71a2e858c6179532, openDox's root `main` after
# `opensoft/openDox` #18 (plan 034 T087). One commit lies between it and the
# pin it replaces, `d5098297`: #18 advances openDox's code leg `047bb4fa` ->
# `dede32b4`, the commit carrying release 1's version bump to 0.1.0 (plan 034
# T101), with its `contracts/code-pin.yaml`, and changes no other path. So
# openDox's `contracts/manifest.yaml`, its `spec` gitlink and
# `contracts/spec-pin.yaml` are byte-unchanged from `d5098297`, the openDox
# bundle this one composes over is still `dox-v1.1`, and none of this bundle's
# five rows moves. THE PIN ADVANCES `d5098297` -> `e1e3a3c3` AT THIS COMMIT, in
# the same commit as the code leg (plan 034 T094, T090 step 5).
#
# IT ADVANCED TO `d5098297` at `opensoft/openXdox` #21, the root `main` after
# `opensoft/openDox` #16 (plan 034 T062). Three commits lay between it and the
# pin it replaced, `663ac683`:
# - `opensoft/openDox` #14 (`52005213`, T053) cuts openDox's `dox-v1.1`: the
#   `spec` gitlink `8fe8c4c7` -> `f7ee3c76` with its `contracts/spec-pin.yaml`,
#   and `contracts/manifest.yaml` `dox-v1.0` -> `dox-v1.1`, which adds a fourth
#   entry, `opendox-snapshot`. The annotated tag `dox-v1.1` (`851a28e9`) is
#   over `52005213`, an ancestor of `d5098297`.
# - #15 changes only `contracts/CHANGELOG.md` (the `dox-v1.1` entry's Status).
# - #16 advances openDox's code leg `2d116415` -> `047bb4fa` with its
#   `contracts/code-pin.yaml`.
# So the pin then named a DESCENDANT of the root tagged by `dox-v1.1`, and the
# openDox bundle this one composes over became `dox-v1.1`. None of this
# bundle's five rows names an openDox path, so none moved. The pin advanced
# `663ac683` -> `d5098297` there, in the same commit as the code leg (plan 034
# T064, T090 step 5).
#
# IT ADVANCED TO `663ac683` at `opensoft/openXdox` #20, the root `main` after
# `opensoft/openDox` #13 (plan 034 T039). That root advances openDox's code
# leg `d816cf06` -> `2d116415` with its `contracts/code-pin.yaml`, and moves
# no bundle byte: openDox's `contracts/manifest.yaml`, its `spec` gitlink and
# `contracts/spec-pin.yaml` are byte-unchanged from
# dc7aa08fe48c8d17b596b0daa1ce87cdc0472aca, the commit `dox-v1.0` tags, which
# is its ancestor; the one other commit between them, `opensoft/openDox` #12,
# changes only `contracts/CHANGELOG.md`. So the pin then named a DESCENDANT
# of the tagged root, and no openDox bundle moved. The pin advanced
# `dc7aa08f` -> `663ac683` there, in the same commit as the code leg (plan 034
# T047, T090 step 5).
#
# IT FIRST ADVANCED TO `dc7aa08f` at `opensoft/openXdox` #15, on the forced
# order the holder set (`opensoft/openxFactory#656` comment 5767733963) and
# RULED 5767804734 item 5: openXdox root pin, then openxFactory's nested legs,
# then the aggregation sync. Until #15 it stood at
# c4c5014d9b39ac55e5df957db23a56db38847a6b, one openDox ROOT behind openDox's
# main, and this paragraph's earlier closing sentence — "registered on `#656`,
# not taken here. No pin moves in this commit." — was true of every commit up
# to that one. It is kept here as the history of why the pin sat where it did,
# not deleted.
#
# THE TAG IS UNCHANGED AND STILL COMPOSES OVER THE OLD ROOT. `xdox-v1.0` is the
# historical first cut over `2073e3a9`, which pins openDox `c4c5014d`, and RULED
# 5767804734 item 5 leaves it exactly where it was cut — no re-cut. So
# `xdox-v1.0` composes over `c4c5014d` and NOT over the openDox root that
# `dox-v1.0` tags; it is `main` that composes over the pinned root: `dc7aa08f`
# from #15, `663ac683` from #20, `d5098297` from #21, and `e1e3a3c3` from this
# commit forward. Those two statements are about different objects and both
# hold.
#
# ADVANCING THIS PIN IS A THREE-REPOSITORY LOCKSTEP, AND ONLY ONE LEG OF IT IS
# TAKEN HERE: openxFactory's `openDox` gitlink, openxFactory's
# `contracts/opendox-pin.yaml`, and this file's sibling
# `contracts/opendox-pin.yaml`, which `verify-opendox-pin.py` check 5 reads as a
# BLOB at whatever commit openxFactory's `openXdox` gitlink names. This commit
# moves the THIRD only. openxFactory's `openXdox` gitlink still records
# `f257e021`, whose blob names `d5098297`, so check 5 goes on reading the OLD
# blob and openxFactory stays in agreement with itself until its own two pairs
# advance together (plan 034 T094's openxFactory PR). At #21 the same gitlink
# recorded `57e2b8f2`, at #20 `069fe471`, and at #15 `88a1047e`.
# ===========================================================================

